name: MLflow CI Training + Docker

on:
  push:
    branches: [ main, master ]
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install MLflow
        run: pip install mlflow[extras] scikit-learn joblib matplotlib seaborn

      - name: Install Dependencies
        run: |
          pip install "mlflow[extras]" scikit-learn joblib matplotlib seaborn pandas

      - name: Run MLflow Project
        working-directory: ./MLProject
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          mlflow run . --env-manager=local

      - name: Upload mlruns Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: MLProject/mlruns/

      # ================= DOCKER (Hanya jika modelling berhasil) =================
      - name: Build & Push Docker Image
        if: success()
        working-directory: ./MLProject
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          # Cari model path
          MODEL_PATH=$(find mlruns -type d -name "model" | head -n 1)
          echo "Model path: $MODEL_PATH"
          
          # Build Docker
          mlflow models build-docker -m "$MODEL_PATH" -n ${{ secrets.DOCKER_USERNAME }}/breast-cancer-model --enable-mlserver
          
          # Login & Push
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker push ${{ secrets.DOCKER_USERNAME }}/breast-cancer-model:latest