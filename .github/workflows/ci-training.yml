name: MLflow CI Training + Docker

on:
  push:
    branches: [ master ]
    paths:
      - 'MLProject/**'

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install mlflow scikit-learn joblib matplotlib seaborn

      - name: Run MLflow Project
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      - name: Upload Artifact (mlruns)
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifact
          path: MLProject/mlruns/

      # ================= DOCKER =================

      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io

      - name: Build Docker Image from MLflow
        run: |
          cd MLProject
          MODEL_PATH=$(find mlruns -type d -name model | head -n 1)
          mlflow models build-docker -m $MODEL_PATH -n mlflow-model

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Tag Docker Image
        run: |
          docker tag mlflow-model ${{ secrets.DOCKER_USERNAME }}/mlflow-model:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mlflow-model:latest